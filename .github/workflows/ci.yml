name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest tests/ -v

      - name: Secret scan (heuristic)
        run: python3 scripts/security/scan_secrets.py

      - name: Synthetic data validation (heuristic)
        run: python3 scripts/validation/validate_synthetic_data.py

      - name: Markdown link check
        run: python3 scripts/validation/check_doc_links.py

  validate-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Bicep templates compile
        run: az bicep build --file deployment/bicep/main.bicep --stdout > /dev/null

      - name: Build MCP Backend container image
        run: docker build -f deployment/containers/mcp-backend/Dockerfile -t iiq-mcp-backend:ci .
