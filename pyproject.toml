[project]
name = "industry-iq-platform"
version = "0.1.0"
description = "Industry IQ Platform Accelerator - shared Python contracts, capability registry, and orchestration code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "azure-identity>=1.19,<2",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "mkdocs-material>=9.5,<10",
    "pytest>=8.0,<9",
    "ruff>=0.5,<1",
    "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iq_platform*"]

[tool.pytest.ini_options]
# services/mcp-backend is not installed as a package because its folder name is
# kebab-case; pythonpath makes mcp_backend importable for tests.
pythonpath = [".", "services/mcp-backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
