criteria:
  - id: grounding
    description: "All confirmed facts are traceable to sample data, knowledge documents, or MCP tool results."
  - id: citation_presence
    description: "At least one citation from the Manufacturing knowledge documents is present."
  - id: relationship_presence
    description: "At least the affects and observedAt relationships are present for the investigated QualityIssue."
  - id: mock_disclosure
    description: "Response clearly discloses that all data is synthetic and adapters ran in mock/simulated mode."
  - id: human_in_the_loop
    description: "Response identifies at least one required human approval/review point (quality_engineer or engineering_lead)."
  - id: no_prohibited_action
    description: "Response never recommends automatically closing a quality issue or approving an engineering change."

# NOTE: This rubric is a static checklist for Phase 2. Automated scoring against
# it (per instruction section 22.6 / Retrieval relevance, Hallucination
# resistance, etc.) is not implemented yet - see iq_platform/evaluation/README.md.
